<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00d084">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <title>Boat Tracker Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: #101419;
      color: #eef4f2;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .topbar {
      background: #151b22;
      border-bottom: 1px solid #2a3340;
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr auto;
      padding: 10px 12px;
      z-index: 1000;
    }

    .title {
      align-items: center;
      display: flex;
      gap: 10px;
      min-width: 0;
    }

    .title h1 {
      color: #f8fbfa;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .signal {
      background: #efb036;
      border-radius: 999px;
      display: inline-block;
      flex: 0 0 auto;
      height: 10px;
      width: 10px;
    }

    .signal.connected {
      background: #00d084;
    }

    .connection {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      min-width: 320px;
    }

    .connection input {
      background: #0c1117;
      border: 1px solid #334052;
      border-radius: 6px;
      color: #eef4f2;
      font: inherit;
      height: 34px;
      max-width: 360px;
      min-width: 220px;
      padding: 0 10px;
      width: 28vw;
    }

    .connection button {
      background: #00a86b;
      border: 0;
      border-radius: 6px;
      color: #06110d;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      height: 34px;
      padding: 0 14px;
    }

    .connection button:hover {
      background: #00c77e;
    }

    .status {
      background: #0c1117;
      border-bottom: 1px solid #2a3340;
      color: #d8e1df;
      font-size: 13px;
      min-height: 32px;
      padding: 8px 12px;
      z-index: 1000;
    }

    .dashboard {
      background: #111820;
      border-bottom: 1px solid #2a3340;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 8px;
      z-index: 1000;
    }

    .stat-box {
      background: #18212b;
      border: 1px solid #2d3948;
      border-radius: 8px;
      min-height: 58px;
      padding: 8px;
    }

    .stat-label {
      color: #99a8b6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .stat-value {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .stat-value.accent {
      color: #00d084;
    }

    .stat-value.warn {
      color: #efb036;
    }

    #map {
      background: #26313c;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .connection {
        justify-content: stretch;
        min-width: 0;
      }

      .connection input {
        max-width: none;
        min-width: 0;
        width: 100%;
      }

      .connection button {
        flex: 0 0 auto;
      }

      .dashboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-value {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="signal" id="signal" aria-hidden="true"></span>
      <h1>Boat Tracker Control</h1>
    </div>
    <div class="connection">
      <input id="ws-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="wss://your-websocket-host">
      <button id="connect-btn" type="button">Connect</button>
    </div>
  </header>

  <div class="status" id="stat">Waiting for WebSocket configuration...</div>

  <section class="dashboard" aria-label="Live telemetry">
    <div class="stat-box">
      <div class="stat-label">Speed</div>
      <div class="stat-value accent" id="speed-val">0.0 km/h</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Distance</div>
      <div class="stat-value accent" id="dist-val">0 m</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Steering Lx</div>
      <div class="stat-value" id="lx-val">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Throttle R2</div>
      <div class="stat-value warn" id="r2-val">0</div>
    </div>
  </section>

  <div id="map"></div>

  <script src="/runtime-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch((error) => {
          console.warn('Service worker registration failed:', error);
        });
      });
    }

    const config = window.BOAT_CONFIG || {};
    const statusEl = document.getElementById('stat');
    const signalEl = document.getElementById('signal');
    const wsInput = document.getElementById('ws-url');
    const connectButton = document.getElementById('connect-btn');

    let socket = null;
    let reconnectTimer = null;
    let activeSocketUrl = '';
    let gamepadIndex = null;
    let controlFrameId = null;
    let lastControlSentAt = 0;
    let lastSentLx = null;
    let lastSentR2 = null;
    let clientPos = null;
    let lastBoatPos = null;
    let lastBoatTime = 0;
    let mapCentered = false;
    const CONTROL_SEND_INTERVAL_MS = 20;
    const CONTROL_KEEPALIVE_MS = 250;
    const MAX_SOCKET_BUFFER_BYTES = 64;
    const currentData = { lx: 0, r2: 0 };

    const map = L.map('map').setView([16.0, 106.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const boatIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    });

    const clientIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    });

    const boatMarker = L.marker([0, 0], { icon: boatIcon }).addTo(map).bindPopup('Boat ESP32');
    const clientMarker = L.marker([0, 0], { icon: clientIcon }).addTo(map).bindPopup('Controller');

    function setStatus(message, connected = false) {
      statusEl.textContent = message;
      signalEl.classList.toggle('connected', connected);
    }

    function sameHostSocketUrl() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${protocol}//${window.location.host}`;
    }

    function readSocketUrlFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return params.get('ws') || params.get('wsUrl') || '';
    }

    function getInitialSocketUrl() {
      const queryUrl = readSocketUrlFromQuery();
      if (queryUrl) {
        localStorage.setItem('boat_ws_url', queryUrl);
        return queryUrl;
      }

      if (config.wsUrl) return config.wsUrl;

      const savedUrl = localStorage.getItem('boat_ws_url');
      if (savedUrl) return savedUrl;

      return config.isVercel ? '' : sameHostSocketUrl();
    }

    function isValidSocketUrl(url) {
      return /^wss?:\/\/.+/i.test(url);
    }

    function connect(url) {
      clearTimeout(reconnectTimer);
      activeSocketUrl = (url || '').trim();
      wsInput.value = activeSocketUrl;

      if (!activeSocketUrl) {
        setStatus('Set BOAT_WS_URL on Vercel or enter a WebSocket URL here.');
        return;
      }

      if (!isValidSocketUrl(activeSocketUrl)) {
        setStatus('WebSocket URL must start with ws:// or wss://.');
        return;
      }

      localStorage.setItem('boat_ws_url', activeSocketUrl);

      if (socket) {
        socket.onclose = null;
        socket.close();
      }

      setStatus(`Connecting to ${activeSocketUrl}...`);
      socket = new WebSocket(activeSocketUrl);
      socket.binaryType = 'arraybuffer';

      socket.onopen = () => {
        setStatus(`Connected to ${activeSocketUrl}`, true);
        sendCurrentControl(true);
      };

      socket.onmessage = (event) => {
        if (typeof event.data !== 'string') return;

        try {
          const data = JSON.parse(event.data);
          if (data.lat !== undefined && data.lon !== undefined) {
            updateBoatData(Number(data.lat), Number(data.lon));
          }
        } catch (error) {
          console.warn('Ignoring non-JSON socket message:', error);
        }
      };

      socket.onerror = () => {
        setStatus('WebSocket error. Check the server URL and TLS certificate.');
      };

      socket.onclose = () => {
        setStatus('Disconnected. Retrying...');
        reconnectTimer = setTimeout(() => connect(activeSocketUrl), 2000);
      };
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const earthRadius = 6371e3;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180;
      const dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp / 2) * Math.sin(dp / 2)
        + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return earthRadius * c;
    }

    function updateBoatData(lat, lon) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const now = Date.now();
      boatMarker.setLatLng([lat, lon]);

      if (clientPos) {
        const dist = getDistance(clientPos.lat, clientPos.lon, lat, lon);
        document.getElementById('dist-val').textContent = `${Math.round(dist)} m`;
      }

      if (lastBoatPos && lastBoatTime) {
        const timeDiff = (now - lastBoatTime) / 1000;
        if (timeDiff > 0) {
          const moveDist = getDistance(lastBoatPos.lat, lastBoatPos.lon, lat, lon);
          const speedKmH = (moveDist / timeDiff) * 3.6;
          if (speedKmH < 100) {
            document.getElementById('speed-val').textContent = `${speedKmH.toFixed(1)} km/h`;
          }
        }
      }

      lastBoatPos = { lat, lon };
      lastBoatTime = now;
    }

    function applyDeadzone(value) {
      return Math.abs(value) < 0.1 ? 0 : Math.round(value * 100);
    }

    function sendCurrentControl(force = false, now = performance.now()) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      if (!force && socket.bufferedAmount > MAX_SOCKET_BUFFER_BYTES) return;

      const packet = new Int8Array([currentData.lx, currentData.r2]);
      socket.send(packet);
      lastControlSentAt = now;
      lastSentLx = currentData.lx;
      lastSentR2 = currentData.r2;
    }

    function updateControlDisplay() {
      document.getElementById('lx-val').textContent = currentData.lx;
      document.getElementById('r2-val').textContent = currentData.r2;
    }

    function pollGamepad(now = performance.now()) {
      if (gamepadIndex === null) return;
      const gamepad = navigator.getGamepads()[gamepadIndex];
      if (!gamepad) return;

      currentData.lx = applyDeadzone(gamepad.axes[0]);
      currentData.r2 = Math.round(gamepad.buttons[7].value * 100);
      updateControlDisplay();

      const changed = currentData.lx !== lastSentLx || currentData.r2 !== lastSentR2;
      const due = now - lastControlSentAt >= CONTROL_SEND_INTERVAL_MS;
      const keepAliveDue = now - lastControlSentAt >= CONTROL_KEEPALIVE_MS;

      if (due && (changed || keepAliveDue)) {
        sendCurrentControl(false, now);
      }
    }

    function controlLoop(now) {
      pollGamepad(now);
      controlFrameId = requestAnimationFrame(controlLoop);
    }

    function startControlLoop() {
      if (controlFrameId !== null) return;
      controlFrameId = requestAnimationFrame(controlLoop);
    }

    function stopControlLoop() {
      if (controlFrameId === null) return;
      cancelAnimationFrame(controlFrameId);
      controlFrameId = null;
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((position) => {
        clientPos = {
          lat: position.coords.latitude,
          lon: position.coords.longitude
        };
        clientMarker.setLatLng([clientPos.lat, clientPos.lon]);

        if (!mapCentered) {
          map.setView([clientPos.lat, clientPos.lon], 16);
          mapCentered = true;
        }
      }, (error) => {
        console.warn('Client GPS unavailable:', error);
      }, { enableHighAccuracy: true });
    }

    window.addEventListener('gamepadconnected', (event) => {
      gamepadIndex = event.gamepad.index;
      setStatus('Gamepad connected.', socket && socket.readyState === WebSocket.OPEN);
      startControlLoop();
    });

    window.addEventListener('gamepaddisconnected', () => {
      currentData.lx = 0;
      currentData.r2 = 0;
      updateControlDisplay();
      sendCurrentControl(true);
      gamepadIndex = null;
      stopControlLoop();
      setStatus('Gamepad disconnected.', socket && socket.readyState === WebSocket.OPEN);
    });

    connectButton.addEventListener('click', () => connect(wsInput.value));
    wsInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') connect(wsInput.value);
    });

    const initialSocketUrl = getInitialSocketUrl();
    wsInput.value = initialSocketUrl;
    connect(initialSocketUrl);
  </script>
</body>
</html>
